# Netlify hosting for the Bolingo Learn website (Expo web export).
#
# Signup flow: Netlify dashboard → Add new site → Import an existing project →
# connect the GitHub repo → build command and publish directory are picked up
# from this file automatically. Then Site settings → Domain management to attach
# the custom domain, and paste that same domain into the AdMob console
# (Settings → app-ads.txt) so the crawler can verify public/app-ads.txt.
#
# The same publish also serves the preview/test channel: push to a branch and
# Netlify builds a Deploy Preview URL with zero extra config.

[build]
  command = "npx expo export --platform web && node scripts/publish-wireframes.cjs"
  publish = "dist"

# The adaptive wireframe board (design/wireframes-v3-adaptive) is copied to
# dist/wireframes/ after the export and served at /wireframes/. Real files win
# over the SPA rewrite below, so it needs no rule of its own.

# Expo Router is a single-page app: every deep link (/paywall, /quiz/3, …)
# must serve index.html with a 200 so the router boots client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Versioned Metro bundles are fingerprinted — cache them hard; never cache
# the entry HTML or the service worker would pin learners to a stale build.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=3153600, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app-ads.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain"
