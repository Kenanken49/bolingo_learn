      <rect x="91" y="137" width="18" height="14" rx="7" fill="#4A4440"/>
    </g>
    <g id="mouth-happy">
      <path d="M80 155 Q100 175 120 155" stroke="#4A4230" stroke-width="7" fill="none" stroke-linecap="round"/>
    </g>
    <circle id="blush-left" cx="30" cy="105" r="12" fill="#FDA4AF" opacity="0.8"/>
    <circle id="blush-right" cx="170" cy="105" r="12" fill="#FDA4AF" opacity="0.8"/>
  </g>
  <g id="necklace">
    <circle cx="66" cy="198" r="7" fill="#EF4444"/>
    <circle cx="83" cy="198" r="7" fill="#FBBF24"/>
    <circle cx="100" cy="198" r="7" fill="#22C55E"/>
    <circle cx="117" cy="198" r="7" fill="#FBBF24"/>
    <circle cx="134" cy="198" r="7" fill="#EF4444"/>
  </g>
  <rect id="foot-left" x="40" y="206" width="44" height="12" rx="6" fill="#57534E"/>
  <rect id="foot-right" x="116" y="206" width="44" height="12" rx="6" fill="#57534E"/>
