name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run every required gate
        env:
          QUALITY_SUPABASE_URL: ${{ secrets.QUALITY_SUPABASE_URL }}
          QUALITY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QUALITY_SUPABASE_SERVICE_ROLE_KEY }}
          # Lets scripts/check-release-artifact.cjs ask the container to hash its own
          # release volume. Empty means CI hashes the download itself: slower, same proof.
          BOLINGO_INTEGRITY_TOKEN: ${{ secrets.BOLINGO_INTEGRITY_TOKEN }}
          QUALITY_ENV: ci
        # Direct node keeps the gate independent of the local npm wrapper;
        # `npm run gate` is the same runner for developers.
        run: node scripts/run-quality-gates.cjs --publish

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: .quality/
          if-no-files-found: warn
          retention-days: 30
