{% extends 'base.html' %}

{% block header %}
<h1>{% block title %}Delete "{{ post['title'] }}"{% endblock %}</h1>
{% endblock %}

{% block content %}
<p>Are you sure you want to delete this post? This cannot be undone.</p>
<form method="post">
  <input name="confirm" type="submit" value="Delete">
  <a href="{{ url_for('blog.index') }}">Cancel</a>
</form>
{% endblock %}
