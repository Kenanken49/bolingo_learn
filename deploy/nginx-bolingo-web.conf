# Bolingo web app — nginx edge for the InterServer VPS.
#
# The VPS already terminates TLS for bolingo.co.ke and serves the secret
# /llm-<token>/ path that production Supabase edge functions call (see
# scripts/vps-llm-setup.sh). Coolify builds and runs the container and
# publishes it on 127.0.0.1:3000; nginx stays the only thing on 80/443, so the
# live tutor endpoint is never touched by the migration.
#
# Include inside the `server` block that has `server_name bolingo.co.ke;`:
#
#   include /etc/nginx/snippets/bolingo-web.conf;
#
# nginx picks the longest matching prefix, so an existing
# `location /llm-<token>/` block keeps winning regardless of include order.

location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Credential/job bodies are small JSON documents.
    client_max_body_size 256k;
    proxy_read_timeout 30s;
}

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    # The Node server sets Cache-Control itself; pass it through untouched.
    proxy_buffering on;
}
